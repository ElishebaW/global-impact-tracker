name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type checking
        run: mypy src/ --strict

      - name: Lint
        run: ruff check src/ tests/

      - name: Format check
        run: ruff format --check src/ tests/

      - name: Security scan (bandit)
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: OWASP security scan (semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      - name: Dependency audit (pip-audit)
        run: pip-audit --format=json --output=pip-audit-report.json || true

      - name: Dependency vulnerability scan (safety)
        run: safety check --json > safety-report.json || true

      - name: Tests
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

      - name: Security violations check
        run: |
          # Fail on high-severity security issues
          if [ -f bandit-report.json ]; then
            HIGH_ISSUES=$(cat bandit-report.json | jq '.results[] | select(.issue_severity == "HIGH") | .test_name' | wc -l)
            if [ "$HIGH_ISSUES" -gt 0 ]; then
              echo "❌ Found $HIGH_ISSUES high-severity security issues"
              cat bandit-report.json | jq '.results[] | select(.issue_severity == "HIGH")'
              exit 1
            fi
          fi

          # Fail on critical vulnerabilities
          if [ -f safety-report.json ]; then
            CRITICAL_VULNS=$(cat safety-report.json | jq '.vulnerabilities[] | select(.advisory.severity == "critical") | .advisory.id' | wc -l)
            if [ "$CRITICAL_VULNS" -gt 0 ]; then
              echo "❌ Found $CRITICAL_VULNS critical vulnerabilities"
              cat safety-report.json | jq '.vulnerabilities[] | select(.advisory.severity == "critical")'
              exit 1
            fi
          fi

          echo "✅ All security checks passed"

  ai-output-validation:
    runs-on: ubuntu-latest
    needs: quality-gates
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate AI-generated content
        run: |
          # Check for hardcoded API keys, secrets, or tokens
          if grep -r -i "api[_-]?key\|secret\|token" src/ --include="*.py" | grep -v "#.*" | grep -v "import"; then
            echo "❌ Potential hardcoded secrets found"
            exit 1
          fi

          # Check for unsafe eval/exec usage
          if grep -r "eval(\|exec(" src/ --include="*.py" | grep -v "#.*"; then
            echo "❌ Unsafe eval/exec usage found"
            exit 1
          fi

          # Check for SQL injection patterns
          if grep -r -E "(execute|query).*\+.*\%" src/ --include="*.py" | grep -v "#.*"; then
            echo "❌ Potential SQL injection patterns found"
            exit 1
          fi

          # Validate AI output patterns in generated files
          if find src/ -name "*.py" -exec grep -l "AI\|LLM\|generated" {} \;; then
            echo "🔍 Found AI-generated files - validating patterns"
            # Add specific AI output validation logic here
          fi

          echo "✅ AI output validation passed"
